# Alembic configuration for the passports backend.
#
# The database URL is injected programmatically by backend/migrate.py (from
# DATABASE_URL) and is deliberately not stored here, so no credentials or
# environment-specific paths live in the repo.
#
# Day-to-day use goes through the CLI wrapper:
#   python -m backend.migrate upgrade head
#   python -m backend.migrate current
#
# Autogenerating a revision after editing backend/models.py, from the repo root:
#   alembic -c backend/alembic.ini revision --autogenerate -m "describe change"

[alembic]
script_location = %(here)s/migrations
# Puts the repo root on sys.path so env.py can "import backend". The alembic
# console script sets sys.path[0] to its own bin/ directory, not the CWD.
prepend_sys_path = %(here)s/..
path_separator = os
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
